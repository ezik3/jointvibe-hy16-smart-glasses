name: HY16Probe
options:
  bundleIdPrefix: com.hy16dev
configs:
  Debug: debug
  Release: release
packages:
  # Live-preview test pass ONLY dependency: VideoLAN's own official,
  # checksum-pinned SPM distribution of VLCKit 4.0.0-a23 (alpha - tracks
  # VLC core's rewritten clock architecture, which structurally removes
  # the fixed-3-second video timestamp rejection this A/B test targets).
  # Previously pinned to the third-party tylerjonesio/vlckit-spm @ 3.6.0
  # wrapper; that stayed on VLC's unchanged 3.0.x clock code and did not
  # fix the issue. AVPlayer/AVKit has no RTSP support on iOS, and
  # FFmpegKit was retired in 2025 - see LivePreviewPlayer.swift.
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a23
  # Audio-capture forensic test ONLY dependency: alta/swift-opus, pinned
  # to the exact HEAD commit (2024-06-16), not the stale 0.0.2 tag
  # (2022-02, 25 PRs behind). Builds real libopus C source via SPM
  # (no precompiled binary, no device/simulator slice ambiguity).
  # Chosen over the manufacturer's own bundled libopus.a after read-only
  # forensic inspection: Opus decode is fully standardized (RFC 6716),
  # so there is no decode-confidence difference between decoders: this
  # package is cleanly SPM-packaged (matches the VLCKit precedent) and
  # has no licensing ambiguity, unlike the manufacturer SDK bundle.
  # See AudioCapture.swift.
  SwiftOpus:
    url: https://github.com/alta/swift-opus
    revision: 6f3cb6bd3ffed1fe5f06d00a962d5c191a50daf8
targets:
  HY16Probe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HY16Probe
        excludes:
          - Info.plist
    dependencies:
      - package: VLCKit
        product: VLCKit
      - package: SwiftOpus
        product: Opus
    settings:
      base:
        INFOPLIST_FILE: HY16Probe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.hy16dev.HY16Probe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9HLXAJ3LPL
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
